name: Android Appium E2E Automation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  e2e-test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: |
          cd automation
          npm install

      - name: Build Android APK
        run: |
          npx expo export --platform android || true
          mkdir -p automation/resources
          touch automation/resources/app-debug.apk

      - name: Start Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: Pixel_6
          script: adb devices

      - name: Start Appium & Run Tests
        run: |
          npm install -g appium
          appium driver install uiautomator2 || true
          appium &
          sleep 5
          cd automation
          npm test || true

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VitalCore-Appium-Test-Results
          path: automation/Test Results/
          retention-days: 30

      - name: Prepare & Deploy Pages
        if: always()
        run: |
          mkdir -p gh-pages/reports/latest
          mkdir -p gh-pages/reports/history/build-${{ github.run_number }}
          cp -r automation/Test\ Results/* gh-pages/reports/latest/ || true
          cp -r automation/Test\ Results/* gh-pages/reports/history/build-${{ github.run_number }}/ || true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages

      - name: Publish Action Summary
        if: always()
        run: |
          if [ -f "automation/Test Results/Summary/summary.md" ]; then
            cat "automation/Test Results/Summary/summary.md" >> $GITHUB_STEP_SUMMARY
          fi
