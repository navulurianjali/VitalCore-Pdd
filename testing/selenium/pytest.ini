[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -s --tb=short
markers =
    auth: Authentication test cases
    dashboard: Dashboard test cases
    profile: Profile test cases
    settings: Settings test cases
    calories: Calorie tracker test cases
    sleep: Sleep tracking test cases
    history: Health history test cases
    fitness: Fitness and exercise test cases
    aicoach: AI companion coach test cases
    futurelab: Future health lab test cases
    challenges: Health challenges test cases
    navigation: Page routing and navigation test cases
    responsive: Viewport and responsive layout test cases
    workflows: Multi-tab and cross-page workflows
