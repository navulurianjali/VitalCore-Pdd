name: VitalCore DAST Security Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  dast-security-scan:
    name: OWASP ZAP & DAST Security Suite (300 Test Cases)
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://bevolemwakfozxuymxsn.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJldm9sZW13YWtmb3p4dXlteHNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MTUyNjUsImV4cCI6MjA5NTQ5MTI2NX0.ZRyBiaR7vhG8O2FEdPEQOBErLrSF5AxK_PASy87Odlk' }}
      APP_URL: "http://127.0.0.1:3000"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Next.js Application
        run: npm run build

      - name: Start VitalCore Web Application
        run: |
          nohup npx next start -H 0.0.0.0 -p 3000 > nextjs_server.log 2>&1 &
          echo "APP_SERVER_PID=$!" >> $GITHUB_ENV
          echo "Next.js production server launched on 0.0.0.0:3000"

      - name: Wait for Application to Become Reachable
        run: |
          npx wait-on -t 90000 http-get://127.0.0.1:3000
          echo "Application is up and reachable"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install DAST Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl python-dotenv

      - name: Run 300 DAST Security Test Cases
        env:
          APP_URL: "http://127.0.0.1:3000"
        run: |
          mkdir -p testing/dast/reports
          python testing/dast/tests/test_cases_300.py || true

      - name: Pull OWASP ZAP Docker Image
        run: docker pull ghcr.io/zaproxy/zaproxy:stable

      - name: Run OWASP ZAP Baseline DAST Scan
        run: |
          mkdir -p zap-reports
          docker run --rm --network="host" \
            -v "${{ github.workspace }}/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://127.0.0.1:3000 \
              -r zap-report.html \
              -J zap-report.json \
              -I \
              --auto \
              2>&1 | tee zap-reports/zap-scan.log || true

      - name: Upload DAST Security Reports (Excel, HTML, JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VitalCore-DAST-Security-Reports
          path: |
            testing/dast/reports/dast_results.xlsx
            testing/dast/reports/dast_results.html
            testing/dast/reports/dast_results.json
            zap-reports/zap-report.html
            zap-reports/zap-report.json
          retention-days: 30

      - name: Stop VitalCore Application Server
        if: always()
        run: |
          if [ -n "$APP_SERVER_PID" ]; then
            kill "$APP_SERVER_PID" 2>/dev/null || true
            echo "Application server stopped."
          fi
