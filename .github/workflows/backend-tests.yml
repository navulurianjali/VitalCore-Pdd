name: VitalCore Backend Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-api-tests:
    name: Backend API Integration Tests
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://bevolemwakfozxuymxsn.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJldm9sZW13YWtmb3p4dXlteHNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MTUyNjUsImV4cCI6MjA5NTQ5MTI2NX0.ZRyBiaR7vhG8O2FEdPEQOBErLrSF5AxK_PASy87Odlk' }}
      # Disable contact API rate limiter during automated CI testing
      CI_DISABLE_RATE_LIMIT: "true"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Next.js Application
        run: npm run build

      - name: Start VitalCore Application Server
        run: |
          nohup npx next start -H 0.0.0.0 -p 3000 > nextjs_server.log 2>&1 &
          echo "APP_SERVER_PID=$!" >> $GITHUB_ENV
          echo "VitalCore launched on port 3000"

      - name: Wait for Application to Become Reachable
        run: |
          npx wait-on -t 90000 http-get://127.0.0.1:3000
          echo "Application is up"

      - name: Verify Application Health
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000)
          echo "HTTP $HTTP_CODE"
          [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 500 ] || { cat nextjs_server.log; exit 1; }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend-tests/requirements.txt

      - name: Run Backend API Tests
        env:
          BASE_URL: "http://127.0.0.1:3000"
        run: |
          mkdir -p backend-tests/reports
          pytest backend-tests/test_backend.py \
            -v --tb=short --no-header \
            -p no:cacheprovider \
            2>&1 | tee backend-tests/reports/pytest_console.log
          # Capture exit code (0=all pass, 1=some fail, 2=interrupted)
          PYTEST_EXIT=${PIPESTATUS[0]}
          echo "pytest exit: $PYTEST_EXIT"
          # Allow test failures – we check via JSON report below
          true

      - name: Print Test Summary
        if: always()
        run: |
          echo "======================================================="
          echo "  VitalCore Backend Test Summary"
          echo "======================================================="
          if [ -f backend-tests/reports/backend_results.json ]; then
            python3 -c "
          import json
          with open('backend-tests/reports/backend_results.json') as f:
              r = json.load(f)
          t = len(r); p = sum(1 for x in r if x['Pass/Fail']=='PASS'); fa = t-p
          pct = round(p/t*100,1) if t else 0
          print(f'  Total  : {t}')
          print(f'  Passed : {p}')
          print(f'  Failed : {fa}')
          print(f'  Rate   : {pct}%')
          if fa:
              for x in r:
                  if x['Pass/Fail']=='FAIL':
                      print(f'  FAIL [{x[chr(84)+chr(101)+chr(115)+chr(116)+chr(32)+chr(73)+chr(68)]}] {x[chr(84)+chr(101)+chr(115)+chr(116)+chr(32)+chr(67)+chr(97)+chr(115)+chr(101)]}')
          "
          else
            echo "  No JSON results (conftest hook may not have fired)"
            echo "  Check pytest_console.log in the artifact"
          fi
          echo "======================================================="

      - name: Upload Backend Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VitalCore-Backend-Test-Reports
          path: |
            backend-tests/reports/backend_results.xlsx
            backend-tests/reports/backend_results.html
            backend-tests/reports/backend_results.json
            backend-tests/reports/pytest_console.log
          retention-days: 30

      - name: Upload Server Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VitalCore-Backend-Server-Log
          path: nextjs_server.log
          retention-days: 7

      - name: Stop Application Server
        if: always()
        run: kill "$APP_SERVER_PID" 2>/dev/null || true

      - name: Fail Job if Tests Failed
        if: always()
        run: |
          if [ ! -f backend-tests/reports/backend_results.json ]; then
            echo "::error::No test results found. Test runner may have crashed."
            exit 1
          fi
          FAILED=$(python3 -c "
          import json
          r = json.load(open('backend-tests/reports/backend_results.json'))
          print(sum(1 for x in r if x['Pass/Fail'] == 'FAIL'))
          ")
          echo "Failed test count: $FAILED"
          [ "$FAILED" -eq 0 ] || { echo "::error::$FAILED backend test(s) failed."; exit 1; }
          echo "All backend tests PASSED."
