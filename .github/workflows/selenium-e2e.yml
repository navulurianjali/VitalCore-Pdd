name: VitalCore Selenium E2E Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  selenium-e2e-suite:
    name: Execute 300 Selenium E2E Tests
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://bevolemwakfozxuymxsn.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJldm9sZW13YWtmb3p4dXlteHNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5MTUyNjUsImV4cCI6MjA5NTQ5MTI2NX0.ZRyBiaR7vhG8O2FEdPEQOBErLrSF5AxK_PASy87Odlk' }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Next.js Application
        run: npm run build

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python Selenium Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r selenium-tests/requirements.txt

      - name: Execute 300 Selenium E2E Tests
        env:
          BASE_URL: "http://127.0.0.1:3000"
          TEST_EMAIL: "testuser@vitalcore.ai"
          TEST_PASSWORD: "VitalCoreTest123!"
          HEADLESS: "true"
        run: |
          nohup npm start > nextjs_server.log 2>&1 &
          SERVER_PID=$!
          echo "Started Next.js production server with PID $SERVER_PID"
          npx wait-on http://127.0.0.1:3000 --timeout 60000
          pytest selenium-tests/tests -v -n 4
          kill $SERVER_PID || true

      - name: Upload Server Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NextJS-Server-Logs
          path: nextjs_server.log
          retention-days: 7

      - name: Upload Excel & HTML Test Reports as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VitalCore-Selenium-E2E-Reports
          path: |
            selenium-tests/reports/selenium_results.xlsx
            selenium-tests/reports/selenium_results.html
            selenium-tests/reports/screenshots/
          retention-days: 30


