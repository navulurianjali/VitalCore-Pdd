name: VitalCore Selenium E2E Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  selenium-e2e-suite:
    name: Execute 300 Selenium E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Next.js Application
        run: npm run build

      - name: Start Next.js Production Web Server
        run: |
          npm start &
          npx wait-on http://localhost:3000 --timeout 60000

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Python Selenium Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r selenium-tests/requirements.txt

      - name: Execute 300 Selenium E2E Tests
        env:
          BASE_URL: "http://localhost:3000"
          TEST_EMAIL: "testuser@vitalcore.ai"
          TEST_PASSWORD: "VitalCoreTest123!"
          HEADLESS: "true"
        run: |
          pytest selenium-tests/tests -v -n 4

      - name: Upload Excel & HTML Test Reports as Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VitalCore-Selenium-E2E-Reports
          path: |
            selenium-tests/reports/selenium_results.xlsx
            selenium-tests/reports/selenium_results.html
            selenium-tests/reports/screenshots/
          retention-days: 30
