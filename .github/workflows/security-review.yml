name: VitalCore Security Review Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scan_level:
        description: 'Scan Level (quick/full)'
        required: false
        default: 'full'

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ── JOB 1: Framework Detection ──────────────────────────────────────────────
  detect-stack:
    name: Detect Backend Stack
    runs-on: ubuntu-latest
    outputs:
      framework: ${{ steps.detect.outputs.framework }}
      has_python: ${{ steps.detect.outputs.has_python }}
      has_expo: ${{ steps.detect.outputs.has_expo }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect Framework
        id: detect
        run: |
          FRAMEWORK="unknown"
          HAS_PYTHON="false"
          HAS_EXPO="false"

          if [ -f "next.config.ts" ] || [ -f "next.config.js" ]; then
            FRAMEWORK="nextjs"
          elif [ -f "package.json" ] && grep -q '"express"' package.json; then
            FRAMEWORK="express"
          elif [ -f "requirements.txt" ] && grep -q "flask\|fastapi\|django" requirements.txt; then
            FRAMEWORK="python"
          fi

          if [ -f "requirements.txt" ]; then
            HAS_PYTHON="true"
          fi

          if [ -d "vitalcore-expo" ] && [ -f "vitalcore-expo/package.json" ]; then
            HAS_EXPO="true"
          fi

          echo "framework=$FRAMEWORK"   >> $GITHUB_OUTPUT
          echo "has_python=$HAS_PYTHON" >> $GITHUB_OUTPUT
          echo "has_expo=$HAS_EXPO"     >> $GITHUB_OUTPUT
          echo "Detected: framework=$FRAMEWORK | python=$HAS_PYTHON | expo=$HAS_EXPO"

  # ── JOB 2: Semgrep SAST ─────────────────────────────────────────────────────
  semgrep-sast:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    needs: detect-stack
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/typescript
            p/react
            p/nodejs
            p/jwt
            p/sql-injection
            p/xss
            p/secrets
            p/owasp-top-ten
        continue-on-error: true

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

      - name: Run Semgrep JSON Report
        run: |
          pip install semgrep -q
          semgrep --config auto \
            --json \
            --output Vulnerability\ Test\ Results/semgrep-results.json \
            src/ vitalcore-expo/e2e/ \
            --severity ERROR --severity WARNING \
            || true
        continue-on-error: true

      - name: Upload Semgrep Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-results
          path: Vulnerability Test Results/semgrep-results.json
          retention-days: 30

  # ── JOB 3: Trivy Vulnerability Scan ─────────────────────────────────────────
  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: detect-stack
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'  # Don't fail pipeline on trivy findings

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

      - name: Trivy Table Report
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy-results.sarif
          retention-days: 30

  # ── JOB 4: Gitleaks Secret Scanning ─────────────────────────────────────────
  gitleaks:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true  # Report but don't fail pipeline

      - name: Upload Gitleaks Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 30

  # ── JOB 5: Dependency Review ─────────────────────────────────────────────────
  dependency-review:
    name: Dependency Vulnerability Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
          deny-licenses: GPL-2.0, AGPL-3.0

  # ── JOB 6: npm Audit ─────────────────────────────────────────────────────────
  npm-audit:
    name: npm Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Web Dependencies
        run: npm ci

      - name: npm Audit Web App
        run: |
          npm audit --audit-level=high --json \
            > "Vulnerability Test Results/npm-audit-web.json" 2>&1 || true
          npm audit --audit-level=critical
        continue-on-error: true

      - name: npm Audit Expo App
        working-directory: vitalcore-expo
        run: |
          npm ci
          npm audit --audit-level=high --json \
            > "../Vulnerability Test Results/npm-audit-expo.json" 2>&1 || true
        continue-on-error: true

      - name: Upload Audit Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-results
          path: Vulnerability Test Results/npm-audit-*.json
          retention-days: 30

  # ── JOB 7: Python DAST ───────────────────────────────────────────────────────
  dast-tests:
    name: DAST API Security Tests
    runs-on: ubuntu-latest
    needs: detect-stack
    if: needs.detect-stack.outputs.has_python == 'true'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python Dependencies
        run: pip install requests openpyxl

      - name: Run DAST API Tests
        run: |
          cd automated_test
          python dast_runner_v2.py
        env:
          NEXT_PUBLIC_SUPABASE_URL:      ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          DAST_BASE_URL:                 ${{ secrets.DAST_BASE_URL }}
        continue-on-error: true

      - name: Upload DAST Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dast-results
          path: |
            automated_test/*.xlsx
            automated_test/*.json
          retention-days: 30

  # ── JOB 8: TypeScript Type Check ─────────────────────────────────────────────
  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Check
        run: npx tsc --noEmit
        continue-on-error: true

  # ── JOB 9: ESLint Security Analysis ─────────────────────────────────────────
  eslint:
    name: ESLint Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: |
          npx eslint src/ \
            --format json \
            --output-file "Vulnerability Test Results/eslint-results.json" \
            || true
        continue-on-error: true

      - name: Upload ESLint Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eslint-results
          path: Vulnerability Test Results/eslint-results.json
          retention-days: 30

  # ── JOB 10: Security Report Generation ──────────────────────────────────────
  generate-security-report:
    name: Generate Security Reports
    runs-on: ubuntu-latest
    needs:
      - semgrep-sast
      - trivy-scan
      - gitleaks
      - npm-audit
    if: always()
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python Deps
        run: pip install openpyxl requests

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: security-artifacts/
        continue-on-error: true

      - name: Generate Security Summary Report
        run: |
          python3 << 'PYEOF'
          import json, os, datetime
          from pathlib import Path

          report_dir = Path("Vulnerability Test Results")
          report_dir.mkdir(exist_ok=True)

          timestamp = datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M UTC")

          summary_md = f"""# VitalCore CI Security Scan Summary
          Generated: {timestamp}
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}

          ## Scan Results

          | Tool | Status | Findings |
          |---|---|---|
          | Semgrep SAST | Completed | See semgrep-results.json |
          | Trivy FS Scan | Completed | See trivy-results.sarif |
          | Gitleaks | Completed | See gitleaks-report.json |
          | npm Audit | Completed | See npm-audit-*.json |
          | DAST API Tests | Completed | See DAST_Report.xlsx |

          ## Pipeline Policy
          - Pipeline FAILS only on CRITICAL vulnerabilities
          - All findings uploaded as artifacts (30-day retention)
          - Security findings visible in GitHub Security tab (SARIF uploads)
          """

          with open(report_dir / "ci-security-summary.md", "w") as f:
            f.write(summary_md)

          print("Security summary report generated.")
          PYEOF

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: Vulnerability Test Results/
          retention-days: 30

      - name: Publish GitHub Actions Summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'SUMMARY'
          ## VitalCore Security Scan Summary

          | Scan | Result |
          |---|---|
          | Semgrep SAST | Completed |
          | Trivy | Completed |
          | Gitleaks | Completed |
          | npm Audit | Completed |

          ### Policy
          - Pipeline **FAILS** only on CRITICAL vulnerabilities
          - All findings uploaded as artifacts (30-day retention)
          - View Security tab for SARIF findings

          ### Documentation
          - [Security Review](./Vulnerability%20Test%20Results/security-review.md)
          - [Remediation Guide](./Vulnerability%20Test%20Results/remediation-guide.md)
          - [Executive Summary](./Vulnerability%20Test%20Results/executive-summary.md)
          SUMMARY

  # ── JOB 11: Critical Vulnerability Gate ──────────────────────────────────────
  security-gate:
    name: Security Gate (Fail on Critical)
    runs-on: ubuntu-latest
    needs:
      - semgrep-sast
      - trivy-scan
      - gitleaks
      - npm-audit
    if: always()
    steps:
      - name: Download Trivy Results
        uses: actions/download-artifact@v4
        with:
          name: trivy-results
          path: ./trivy-results
        continue-on-error: true

      - name: Check for Critical Vulnerabilities
        run: |
          echo "Checking for CRITICAL severity vulnerabilities..."
          
          # Check npm audit for critical issues
          if [ -f "npm-audit-results/npm-audit-web.json" ]; then
            CRITICAL_COUNT=$(cat npm-audit-results/npm-audit-web.json | python3 -c "
          import sys, json
          try:
            data = json.load(sys.stdin)
            print(data.get('metadata', {}).get('vulnerabilities', {}).get('critical', 0))
          except: print(0)
          ")
            echo "Critical npm vulnerabilities: $CRITICAL_COUNT"
            if [ "$CRITICAL_COUNT" -gt "0" ]; then
              echo "::error::CRITICAL npm vulnerabilities found: $CRITICAL_COUNT"
              exit 1
            fi
          fi
          
          echo "Security gate PASSED — no critical vulnerabilities found in dependencies."
