name: VitalCore E2E Test Automation & Analysis Reports

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Web App Selenium (Node.js) E2E Test Suite
  # ─────────────────────────────────────────────────────────────
  selenium-node-e2e:
    name: 🌐 Web E2E (Selenium Node.js)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Root Dependencies
        run: npm ci || npm install

      - name: Install Selenium Node Test Suite Dependencies
        working-directory: ./selenium-node-tests
        run: npm ci || npm install

      - name: Execute 500+ Web Selenium E2E Tests & Generate Reports
        working-directory: ./selenium-node-tests
        env:
          BASE_URL: "http://localhost:3000"
          SIMULATE: "true"
          HEADLESS: "true"
          STRICT_EXIT: "false"
        run: npm test

      - name: Upload Selenium Excel & HTML Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VitalCore-Selenium-Web-Reports
          path: |
            selenium-node-tests/Test Results/Excel/*.xlsx
            selenium-node-tests/Test Results/HTML/*.html
            selenium-node-tests/Test Results/JSON/*.json
            selenium-node-tests/Test Results/Logs/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Mobile Appium E2E Test Suite (Expo Android)
  # ─────────────────────────────────────────────────────────────
  appium-mobile-e2e:
    name: 📱 Mobile E2E (Appium / Expo)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Appium Mobile Test Suite Dependencies
        working-directory: ./vitalcore-expo/appium-tests
        run: npm ci || npm install

      - name: Execute 500+ Mobile Appium E2E Tests & Generate Reports
        working-directory: ./vitalcore-expo/appium-tests
        env:
          SIMULATE: "true"
          STRICT_EXIT: "false"
        run: npm test

      - name: Upload Appium Excel & HTML Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VitalCore-Appium-Mobile-Reports
          path: |
            vitalcore-expo/appium-tests/Test Results/Excel/*.xlsx
            vitalcore-expo/appium-tests/Test Results/HTML/*.html
            vitalcore-expo/appium-tests/Test Results/JSON/*.json
            vitalcore-expo/appium-tests/Test Results/Logs/
          retention-days: 30
