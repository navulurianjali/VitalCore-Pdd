name: VitalCore Enterprise Appium E2E Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  appium-e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Tools
        uses: android-actions/setup-android@v3

      - name: Install Appium 2.x & UiAutomator2 Driver
        run: |
          npm install -g appium@next
          appium driver install uiautomator2

      - name: Generate Appium Test Execution Reports
        run: |
          cd vitalcore-expo
          npm ci
          npx ts-node e2e/run-reports.ts

      - name: Upload Test Execution Reports (HTML, Excel, JSON)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-test-reports
          path: |
            vitalcore-expo/e2e/reports/appium_execution_report.html
            vitalcore-expo/e2e/reports/appium_execution_report.csv
            vitalcore-expo/e2e/reports/appium_execution_report.json
          retention-days: 30
