name: Deploy Automation Reports to GitHub Pages

on:
  workflow_run:
    workflows: ["Android Appium E2E Automation Pipeline", "VitalCore Enterprise Appium E2E Pipeline"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Test Results Artifact
        uses: actions/download-artifact@v4
        with:
          name: VitalCore-Appium-Test-Results
          path: download-artifacts
        continue-on-error: true

      - name: Prepare GitHub Pages Directory Structure
        run: |
          mkdir -p gh-pages/reports/latest
          mkdir -p gh-pages/reports/history/build-${{ github.run_number }}
          if [ -d "download-artifacts" ]; then
            cp -r download-artifacts/* gh-pages/reports/latest/ || true
            cp -r download-artifacts/* gh-pages/reports/history/build-${{ github.run_number }}/ || true
          elif [ -d "vitalcore-expo/e2e/reports" ]; then
            cp -r vitalcore-expo/e2e/reports/* gh-pages/reports/latest/ || true
            cp -r vitalcore-expo/e2e/reports/* gh-pages/reports/history/build-${{ github.run_number }}/ || true
          fi
          touch gh-pages/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages
          force_orphan: true
