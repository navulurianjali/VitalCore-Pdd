name: Selenium E2E Automation Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Target Application Base URL'
        required: false
        default: 'https://vitalcore-pdd.vercel.app'

jobs:
  selenium-tests:
    name: Run Selenium E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r selenium-tests/requirements.txt

      - name: Install Google Chrome & ChromeDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Run Selenium Pytest Suite
        env:
          BASE_URL: ${{ github.event.inputs.base_url || secrets.BASE_URL || 'https://vitalcore-pdd.vercel.app' }}
          TEST_EMAIL: ${{ secrets.TEST_EMAIL || 'testuser@vitalcore.ai' }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD || 'VitalCoreTest123!' }}
          HEADLESS: 'true'
        run: |
          pytest selenium-tests/tests -v

      - name: Upload Excel & HTML Reports Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-reports
          path: |
            selenium-tests/reports/selenium_results.xlsx
            selenium-tests/reports/selenium_results.html

      - name: Upload Failure Screenshots Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: selenium-tests/reports/screenshots/
